name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The kit's palette is derived from the theme registry (ADR-0050), so a
      # palette change must not be able to land in the chrome while artifacts
      # keep painting the old hexes. Regenerate and fail on drift — the same
      # freshness discipline ADR-0006 set for the generated skills catalog.
      # `tokens.test.ts` deliberately checks only the structural invariants,
      # leaving the values to this step rather than to a second hand-kept copy.
      - name: Artifact kit output is generated, never hand-edited
        run: |
          node scripts/gen-artifact-tokens.ts
          pnpm --filter @steward/artifact-kit build
          node scripts/gen-template-previews.ts
          git diff --exit-code -- \
            packages/artifact-kit/src/tokens/tokens.css \
            .claude/skills/widget-artifact/tokens.json \
            .claude/skills/widget-artifact/kit/kit.css \
            .claude/skills/widget-artifact/kit/render.mjs \
            .claude/skills/widget-artifact/kit/throughput.js
          # The previews are checked with `status`, not `diff`, because they are
          # the one generated output whose *set* changes: adding a template to
          # PREVIEWS writes a new file, and `git diff` cannot see a file that
          # was never added — an uncommitted preview would pass as merely
          # untracked. `status` catches added, modified and pruned alike.
          drift="$(git status --porcelain --untracked-files=all -- docs/samples)"
          if [ -n "$drift" ]; then
            echo "docs/samples is stale — re-run node scripts/gen-template-previews.ts"
            echo "$drift"
            exit 1
          fi
      # The identity is one geometry with many mirrors (ADR-0052): the React
      # component, the favicon, the launcher sources, both wordmarks and the
      # whole brand kit are renders of apps/web/app/lib/mark.ts. They used to
      # be six hand-synced copies of the same path data; this step is what
      # replaced "keep in sync" as a comment with a check.
      #
      # SVG only. The PNGs beside them are rendered through headless Chrome
      # (ImageMagick's SVG delegate is not faithful to the gradients and
      # filters), which is not available here — `scripts/render-icons.sh`
      # stays a local step.
      - name: Identity assets are generated, never hand-edited
        run: |
          node scripts/gen-brand.ts
          drift="$(git status --porcelain --untracked-files=all -- \
            brand ':(exclude)brand/*/png' \
            apps/web/public/favicon.svg \
            apps/web/public/wordmark-light.svg \
            apps/web/public/wordmark-dark.svg \
            templates/data-repo/.github \
            scripts/icon.svg scripts/icon-maskable.svg)"
          if [ -n "$drift" ]; then
            echo "identity assets are stale — re-run node scripts/gen-brand.ts"
            echo "$drift"
            exit 1
          fi
      - run: pnpm exec vp check
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Install Chromium (vitest browser project)
        run: pnpm --filter @steward/web exec playwright install chromium --with-deps
      - run: pnpm test
