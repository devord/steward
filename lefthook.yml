pre-commit:
  # Run fmt before lint sequentially — both write to the same staged files,
  # so parallel execution causes a write/write race and flaky output.
  parallel: false
  commands:
    fmt:
      glob: "*.{js,ts,tsx,json,md,sh}"
      run: pnpm exec vp fmt --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,ts,tsx}"
      # Mirrors `lint.ignorePatterns` in vite.config.ts. Without it a commit
      # touching only the vendored plugin hands oxlint a list where every file
      # is ignored, and oxlint exits 1 on "No files found to lint" rather than
      # succeeding as a no-op — so the hook fails on a change it never linted.
      exclude:
        - "tools/oxlint/anti-slop/**"
      run: pnpm exec vp lint --fix --max-warnings=0 {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    fmt:
      glob: "*.{js,ts,tsx,json,md,sh}"
      run: pnpm exec vp fmt --check {push_files}
    lint:
      glob: "*.{js,ts,tsx}"
      exclude:
        - "tools/oxlint/anti-slop/**"
      run: pnpm exec vp lint --max-warnings=0 {push_files}
